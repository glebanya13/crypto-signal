[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-signal-bot"
version = "0.1.0"
description = "Telegram market analytics bot using public Binance Spot data"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.13,<4", "ccxt>=4.4", "pandas>=2.2", "numpy>=2.0", "scipy>=1.14",
  "plotly>=5.24", "kaleido>=0.2.1", "pydantic-settings>=2.5", "httpx[socks]>=0.27", "python-socks>=2.5",
  "structlog>=24.4", "websockets>=13"
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
